<?xml version="1.0" encoding="UTF-8"?>
<!-- JPilot expanded mark (orb nexus), light-theme — animated AI core orchestrating three appliances -->
<svg width="450" height="450" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .breath { transform-origin: 150px 150px; transform-box: view-box; animation: breath 4s ease-in-out infinite; }
    .link { animation: flow 1.1s linear infinite; }
    .wave rect { transform-box: view-box; animation: eq 1.4s ease-in-out infinite; }
    @keyframes breath { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes eq { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .breath, .link, .wave rect { animation: none; } }
  </style>
  <defs>
    <linearGradient id="jpRingL" x1="86" y1="86" x2="214" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="jpGlowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jpCoreL" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#14536b"/>
      <stop offset="1" stop-color="#0b1426"/>
    </radialGradient>
  </defs>
  <circle cx="150" cy="150" r="95" fill="url(#jpGlowL)" class="breath"/>
  <g fill="none" stroke="#0891b2" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 11">
    <path d="M 150 92 L 150 62" class="link"/>
    <path d="M 102.8 183.7 L 74.8 203.7" class="link" style="animation-delay: 0.35s"/>
    <path d="M 197.2 183.7 L 225.2 203.7" class="link" style="animation-delay: 0.7s"/>
  </g>
  <circle cx="150" cy="150" r="52" fill="url(#jpCoreL)" stroke="url(#jpRingL)" stroke-width="7"/>
  <g fill="#a5f3fc" class="wave">
    <rect x="127" y="139" width="9" height="22" rx="4.5" style="transform-origin: 131.5px 150px"/>
    <rect x="141" y="128" width="9" height="44" rx="4.5" style="transform-origin: 145.5px 150px; animation-delay: 0.2s"/>
    <rect x="155" y="122" width="9" height="56" rx="4.5" style="transform-origin: 159.5px 150px; animation-delay: 0.4s"/>
    <rect x="169" y="134" width="9" height="32" rx="4.5" style="transform-origin: 173.5px 150px; animation-delay: 0.6s"/>
  </g>
  <g fill="#0c1524" stroke-width="4.5">
    <rect x="130" y="20" width="40" height="40" rx="10" stroke="#0891b2"/>
    <rect x="32" y="200" width="40" height="40" rx="10" stroke="#0284c7"/>
    <rect x="228" y="200" width="40" height="40" rx="10" stroke="#4f46e5"/>
  </g>
  <path d="M 140 36 H 160 M 140 45 H 160 M 42 216 H 62 M 42 225 H 62 M 238 216 H 258 M 238 225 H 258" fill="none" stroke="#7dd3fc" stroke-width="3.5"/>
</svg>
